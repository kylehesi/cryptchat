# Runs the unit and end-to-end tests on every push and pull request.
# *.local.test.js (real desktop capture, local TURN server) are skipped here because CI is set.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: End-to-end tests (two app windows)
        run: npm run test:e2e
