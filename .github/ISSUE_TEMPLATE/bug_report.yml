name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems go to SECURITY.md, not here.**
        For the log, press **[ COPY_LOG ]** in the KERNEL_LOG header and paste it below: IP addresses,
        server hosts, payloads, file names and window titles are already masked.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connecting / payloads
        - Voice
        - Screen share
        - File transfer
        - Chat
        - Settings / TURN
        - Installer
        - Other
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: KERNEL_LOG
      description: Press [ COPY_LOG ] in the KERNEL_LOG header and paste here (personal details are masked). Read it once before posting.
      render: text
  - type: input
    id: version
    attributes:
      label: CryptChat version
      placeholder: e.g. 0.1.0, or "source, commit abc1234"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Both on home internet
        - One or both on mobile data
        - Same local network
        - Corporate / school network
        - Not sure
